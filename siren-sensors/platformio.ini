; SIREN - two-node sensor firmware
;
; Two boards, one firmware each:
;   ppg   -> the board carrying the MAX30102. Aggregates and prints everything.
;   temp  -> the board carrying the MLX90614. Broadcasts temperature at 1 Hz.
;
; IMPORTANT: `board` and the I2C pins are set PER ENVIRONMENT, because the two
; boards need not be the same chip. Check each one and set its block below.
;
;   Classic ESP32 (DevKit v1)  -> board = esp32dev
;                                 Any free GPIO can carry I2C. This project
;                                 wires it to GPIO26 (SDA) / GPIO14 (SCL).
;   ESP32-S3 (DevKitC-1)       -> board = esp32-s3-devkitc-1
;                                 GPIO22 DOES NOT EXIST on the S3, its GPIO
;                                 range is 0-21 then 26-48, so the classic
;                                 pins cannot be used. This project wires the
;                                 S3's I2C to GPIO4 (SDA) / GPIO5 (SCL).
;
; Current assignment:
;   ppg  -> classic ESP32 DevKit, MAX30102, SDA GPIO26 / SCL GPIO14
;   temp -> ESP32-S3,             MLX90614, SDA GPIO4  / SCL GPIO5
;
; Note on GPIO14: the classic ESP32 drives it during boot, so a scope would
; show activity there before the firmware starts. Harmless for I2C, since the
; bus idles high and nothing is clocked until Wire.begin() runs, but worth
; knowing if the sensor ever behaves oddly in the first moments after reset.
;
; Flash one board at a time so the auto-detected port cannot pick the wrong one:
;   pio run -e temp -t upload
;   pio run -e ppg  -t upload
;
; Or name the port explicitly (pio device list shows them):
;   pio run -e ppg -t upload --upload-port COM5
;   pio device monitor -p COM5

[platformio]
default_envs = ppg

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = time
; src/shared is on the include path, so both nodes write #include "filters.h"
; rather than a relative path out of their own folder.
build_flags = -I src/shared

; ---------------------------------------------------------------------------
; PPG node: MAX30102, plus temperature received over ESP-NOW
[env:ppg]
board = esp32dev
build_src_filter = +<ppg/> +<shared/>
build_flags =
    ${env.build_flags}
    -D SIREN_SDA=26
    -D SIREN_SCL=14
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

; ---------------------------------------------------------------------------
; Temperature node: MLX90614, broadcasting over ESP-NOW
; Set to ESP32-S3, which is what the attached board reported.
; No lib_deps: the MLX90614 is driven directly from src/shared/mlx90614.h.
; The Adafruit library called Wire.begin() inside its own init, which on the
; S3 core fails against an already-initialised bus and was reported as a
; missing sensor.
[env:temp]
board = esp32-s3-devkitc-1
build_src_filter = +<temp/> +<shared/>
build_flags =
    ${env.build_flags}
    -D SIREN_SDA=4
    -D SIREN_SCL=5

; ---------------------------------------------------------------------------
; Diagnostic only: scans the I2C bus and lists addresses found.
; Two variants because the pins differ per chip. Run the one matching the
; board you have plugged in.
[env:scanner]
board = esp32dev
build_src_filter = +<scanner/>
build_flags =
    ${env.build_flags}
    -D SIREN_SDA=26
    -D SIREN_SCL=14

[env:scanner_s3]
board = esp32-s3-devkitc-1
build_src_filter = +<scanner/>
build_flags =
    ${env.build_flags}
    -D SIREN_SDA=4
    -D SIREN_SCL=5

; Diagnostic only: measures the real MAX30102 acquisition rate two ways.
; Flash to the PPG board.
[env:bench]
board = esp32dev
build_src_filter = +<bench/>
build_flags =
    ${env.build_flags}
    -D SIREN_SDA=26
    -D SIREN_SCL=14
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2